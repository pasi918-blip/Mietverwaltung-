<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mietverwaltung</title>
<style>
:root{--bg:#f3f6f6;--sf:#fff;--tx:#16262e;--mu:#5b6b73;--ln:#d5dfe1;--ac:#0e6b66;--ac2:#e3f1ef;--wn:#b4540a;--wn2:#fdeede;--ok:#2f7d3a;--er:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a1e;--sf:#16252b;--tx:#e6eef0;--mu:#93a6ad;--ln:#2a3d44;--ac:#4cc3b9;--ac2:#18343a;--wn:#f0a15f;--wn2:#3a2a1a;--ok:#7bd187;--er:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a1e;--sf:#16252b;--tx:#e6eef0;--mu:#93a6ad;--ln:#2a3d44;--ac:#4cc3b9;--ac2:#18343a;--wn:#f0a15f;--wn2:#3a2a1a;--ok:#7bd187;--er:#ff8a80;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sf);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--sf);border-bottom:1px solid var(--ln);z-index:9}
h1{font-size:1.1rem;margin:0;padding:10px 14px 4px;font-weight:700}
nav{display:flex;gap:2px;overflow-x:auto;padding:0 8px}
nav button{flex:none;border:0;background:none;color:var(--mu);padding:10px 12px;font:inherit;font-size:.92rem;border-bottom:3px solid transparent;cursor:pointer}
nav button.on{color:var(--ac);border-color:var(--ac);font-weight:600}
main{max-width:760px;margin:0 auto;padding:14px}
.bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.bar>*{flex:0 1 auto}
select,input,textarea{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:9px 10px;width:100%}
.bar select,.bar input{width:auto}
textarea{min-height:70px;resize:vertical}
button.b{font:inherit;border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:8px;padding:8px 14px;cursor:pointer}
button.p{background:var(--ac);color:var(--bg);border-color:var(--ac);font-weight:600}
button.d{color:var(--er)}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.t{font-weight:600}.s{color:var(--mu);font-size:.9rem;margin-top:2px;white-space:pre-line}
.tag{display:inline-block;font-size:.78rem;padding:1px 8px;border-radius:99px;background:var(--ac2);color:var(--ac);margin-right:6px}
.tag.w{background:var(--wn2);color:var(--wn)}.tag.g{background:var(--ac2);color:var(--ok)}
.acts{display:flex;gap:6px;flex:none}.acts button{padding:5px 10px;font-size:.85rem}
.empty{color:var(--mu);text-align:center;padding:28px 10px;border:1px dashed var(--ln);border-radius:10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:12px}
.stat b{display:block;font-size:1.6rem}.stat span{color:var(--mu);font-size:.88rem}
.pay{display:flex;align-items:center;gap:12px}
.pay input[type=checkbox]{width:26px;height:26px;flex:none;accent-color:var(--ac)}
dialog{border:1px solid var(--ln);border-radius:12px;background:var(--sf);color:var(--tx);width:min(520px,94vw);padding:16px;max-height:90vh}
dialog::backdrop{background:rgba(0,0,0,.45)}
label{display:block;font-size:.88rem;color:var(--mu);margin:10px 0 3px}
h2{font-size:1rem;margin:18px 0 8px}
a{color:var(--ac)}
.th{display:block;margin-top:8px;max-width:100%;max-height:160px;min-width:60px;min-height:60px;border-radius:8px;border:1px solid var(--ln);background:var(--ac2);cursor:pointer}
.tw{overflow-x:auto;margin-bottom:10px}table{border-collapse:collapse;width:100%;font-size:.88rem}
table th,table td{padding:7px 8px;border-bottom:1px solid var(--ln);text-align:center;white-space:nowrap}table th{text-align:left;font-weight:600}
thead td{color:var(--mu);font-size:.8rem}td.ok{color:var(--ok);font-weight:700}td.hh{text-align:left;font-weight:700;background:var(--ac2);color:var(--ac)}
.ck{display:flex;align-items:center;gap:10px;margin:10px 0 0;font-size:1rem;color:var(--tx)}.ck input{width:24px;height:24px;flex:none;accent-color:var(--ac)}
.ph{display:none}
@media print{:root:root:root{--bg:#fff;--sf:#fff;--tx:#000;--mu:#444;--ln:#bbb;--ok:#1a6b25;--ac:#0e6b66;--ac2:#eee;--wn:#a04800;--wn2:#eee;color-scheme:light}header,.bar,body::before,.noprint{display:none!important}main{max-width:none;padding:0}.ph{display:block;font-weight:700;font-size:1.2rem;margin-bottom:10px}.tw{overflow:visible}.card,.stat,tr{break-inside:avoid}table{font-size:.75rem}}
.pv{margin-bottom:28px;padding:14px;background:var(--sf);border:1px solid var(--ln);border-radius:10px}.stf{font-size:.85rem;color:var(--mu);border-bottom:1px solid var(--ln);padding-bottom:6px;margin-bottom:18px}.stt{margin-bottom:22px}
.st table td{text-align:right}.st table th{text-align:left;font-weight:400;white-space:normal}.st tr.sum th,.st tr.sum td{font-weight:700}
.cr{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-end}.cr .n{flex:1 1 100%}.cr input[type=number]{flex:1 1 90px}.cr select{flex:2 1 140px}
@media print{.pv{border:0;padding:0;margin:0;break-after:page}.pv:last-child{break-after:auto}}
</style><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0e6b66"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
</head><body>
<header><h1>Mietverwaltung</h1><nav id="nav"></nav></header>
<main id="main"></main>
<dialog id="dlg"><form id="frm" onsubmit="return false"></form></dialog>
<script>
const TABS=[["home","Übersicht"],["houses","Häuser"],["units","Wohnungen"],["meters","Zähler"],["oil","Heizöl"],["pay","Miete"],["nka","Nebenkosten"],["abr","Abrechnung"],["year","Zusammenfassung"],["moves","Ein-/Auszüge"],["docs","Dokumente"],["tasks","Aufgaben"]];
let S={units:[],houses:[],nka:[],oil:[],abr:{},vm:"",meters:[],pay:{},moves:[],docs:[],tasks:[]},tab="home",fu="",month=new Date().toISOString().slice(0,7);
try{const x=localStorage.getItem("mv1");if(x)S=Object.assign(S,JSON.parse(x))}catch(e){}
function save(){try{localStorage.setItem("mv1",JSON.stringify(S))}catch(e){alert("Speichern im Browser nicht möglich. Bitte Sicherung exportieren.")}}
const h=s=>s==null?"":String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const hn=id=>(S.houses.find(x=>x.id==id)||{}).name||"";
const inH=(id,hid)=>id==="h:"+hid||(S.units.find(x=>x.id==id)||{}).house==hid;
const un=id=>{if(String(id).startsWith("h:"))return "Haus "+hn(id.slice(2))+" (gesamt)";const u=S.units.find(x=>x.id==id);return u?(hn(u.house)?hn(u.house)+" · ":"")+u.name:"–"};
const rs=u=>(u.rooms||"").split("\n").reduce((a,l)=>{const m=l.match(/([\d.,]+)\s*(qm|m²)?\s*$/);return a+(m?parseFloat(m[1].replace(",","."))||0:0)},0);
const fd=d=>d?new Date(d+"T00:00").toLocaleDateString("de-DE"):"";
const eur=n=>Number(n||0).toLocaleString("de-DE",{style:"currency",currency:"EUR"});
const today=()=>new Date().toISOString().slice(0,10);
const METER=["Strom","Gas","Wasser kalt","Wasser warm","Heizung"];
const SEC={
houses:{t:"Haus",f:[["name","Bezeichnung","text",1],["addr","Adresse","text"],["note","Notizen","area"]],title:r=>r.name,sub:r=>[r.addr,S.units.filter(u=>u.house==r.id).length+" Wohnung(en) · "+S.units.filter(u=>u.house==r.id).reduce((a,u)=>a+Number(u.area||0),0).toLocaleString("de-DE")+" qm",r.note].filter(Boolean).join("\n")},
oil:{t:"Heizölstand",f:[["house","Haus","house"],["date","Datum","date",1],["lvl","Aktueller Füllstand im Tank (Liter), bei Nachfüllung: Stand danach","number",1],["fill","Nachgefüllt (Liter), nur ausfüllen wenn du befüllt hast","number"],["price","Preis gesamt (€)","number"],["note","Notiz","text"]],sort:(a,b)=>b.date.localeCompare(a.date),title:r=>(hn(r.house)||"Heizöltank")+" · "+fd(r.date),sub:r=>{const v=oilV(r);return ["Stand: "+Number(r.lvl).toLocaleString("de-DE")+" l",r.fill?"Nachgefüllt: "+Number(r.fill).toLocaleString("de-DE")+" l"+(r.price?" für "+eur(r.price)+" ("+(r.price/r.fill*100).toLocaleString("de-DE",{maximumFractionDigits:2})+" €/100 l)":""):"",v!=null?"Verbrauch seit letztem Eintrag: "+v.toLocaleString("de-DE")+" l":"",r.note].filter(Boolean).join("\n")}},
nka:{t:"Nebenkostenabrechnung",f:[["unit","Wohnung","unit",1],["year","Abrechnungsjahr","number",1],["pre","Vorauszahlungen gesamt (€)","number"],["cost","Tatsächliche Kosten (€)","number"],["status","Status","sel",1,["offen","abgerechnet","Nachzahlung/Guthaben beglichen"]],["note","Notizen","area"]],sort:(a,b)=>b.year-a.year,title:r=>un(r.unit)+" · "+r.year,sub:r=>[nkd(r),"Vorauszahlung "+eur(r.pre)+" · Kosten "+eur(r.cost),r.note].filter(Boolean).join("\n"),tag:r=>`<span class="tag ${r.status=="offen"?"w":"g"}">${r.status}</span>`},
units:{t:"Wohnung",f:[["house","Haus","house"],["name","Bezeichnung (z. B. 2. OG links)","text",1],["tenant","Mieter","text"],["area","Wohnfläche gesamt (qm)","number"],["persons","Personen (für Abrechnung nach Personen)","number"],["rooms","Räume (eine Zeile pro Raum, z. B. Wohnzimmer, 24,5)","area"],["rent","Kaltmiete (€ pro Monat)","number"],["nk","Nebenkosten-Vorauszahlung (€ pro Monat)","number"],["dep","Kaution (€)","number"],["since","Mietbeginn","date"],["note","Notizen","area"]],
 title:r=>un(r.id),sub:r=>[r.tenant?"Mieter: "+r.tenant:"leer / kein Mieter",r.area?Number(r.area).toLocaleString("de-DE")+" qm"+(r.rent?" · "+(r.rent/r.area).toLocaleString("de-DE",{maximumFractionDigits:2})+" €/qm kalt":""):"",r.rooms&&"Räume:\n"+r.rooms+(rs(r)?"\n(Summe Räume: "+rs(r).toLocaleString("de-DE",{maximumFractionDigits:2})+" qm)":""),r.rent?"Kalt "+eur(r.rent)+(r.nk?" + NK "+eur(r.nk)+" = "+eur(+r.rent+ +r.nk):"")+" / Monat":"",r.dep?"Kaution "+eur(r.dep):"",r.since?"seit "+fd(r.since):"",r.note].filter(Boolean).join("\n")},
meters:{t:"Zählerstand",file:1,f:[["unit","Wohnung oder Haus","unit",1],["type","Zählerart","sel",1,METER],["nr","Zählernummer oder Bezeichnung (z. B. Waschmaschine)","text"],["date","Ablesedatum","date",1],["val","Zählerstand","number",1],["note","Notiz","text"]],
 sort:(a,b)=>b.date.localeCompare(a.date),title:r=>un(r.unit)+" · "+r.type,
 sub:r=>{const p=S.meters.filter(m=>m.unit==r.unit&&m.type==r.type&&(m.nr||"")==(r.nr||"")&&m.id!=r.id&&m.date<=r.date).sort((a,b)=>b.date.localeCompare(a.date))[0];
  return fd(r.date)+": "+Number(r.val).toLocaleString("de-DE")+(r.nr?" (Zähler "+r.nr+")":"")+(p?"\nVerbrauch seit "+fd(p.date)+": "+(r.val-p.val).toLocaleString("de-DE",{maximumFractionDigits:3}):"")+(r.note?"\n"+r.note:"")}},
moves:{t:"Ein-/Auszug",f:[["unit","Wohnung","unit",1],["kind","Art","sel",1,["Einzug","Auszug"]],["date","Datum","date",1],["who","Mieter","text"],["prot","Übergabeprotokoll / Zustand","area"],["keys","Schlüssel übergeben/zurück","text"],["dep","Kaution zurückgezahlt / erhalten","text"]],
 sort:(a,b)=>b.date.localeCompare(a.date),title:r=>r.kind+": "+un(r.unit),
 sub:r=>[fd(r.date)+(r.who?" · "+r.who:""),r.keys&&"Schlüssel: "+r.keys,r.dep&&"Kaution: "+r.dep,r.prot].filter(Boolean).join("\n")},
docs:{t:"Dokument",file:1,f:[["title","Titel","text",1],["unit","Wohnung","unit"],["cat","Kategorie","sel",1,["Mietvertrag","Übergabeprotokoll","Nebenkostenabrechnung","Rechnung","Versicherung","Schriftverkehr","Sonstiges"]],["date","Datum","date"],["note","Notizen","area"]],
 sort:(a,b)=>(b.date||"").localeCompare(a.date||""),title:r=>r.title,sub:r=>[r.cat+(r.unit?" · "+un(r.unit):"")+(r.date?" · "+fd(r.date):""),r.fname&&"Datei: "+r.fname,r.note].filter(Boolean).join("\n")},
tasks:{t:"Aufgabe",file:1,f:[["title","Was ist zu tun?","text",1],["unit","Wohnung","unit"],["kind","Art","sel",1,["To-do","Wartung","Reparatur"]],["status","Status","sel",1,["offen","in Arbeit","erledigt"]],["due","Fällig am","date"],["who","Handwerker / Zuständig","text"],["cost","Kosten (€)","number"],["note","Dokumentation / Notizen","area"]],
 sort:(a,b)=>(a.status=="erledigt")-(b.status=="erledigt")||(a.due||"9").localeCompare(b.due||"9"),title:r=>r.title,
 sub:r=>[(r.unit?un(r.unit)+" · ":"")+(r.due?"fällig "+fd(r.due):"ohne Termin")+(r.who?" · "+r.who:"")+(r.cost?" · "+eur(r.cost):""),r.note].filter(Boolean).join("\n"),
 tag:r=>`<span class="tag ${r.status=="erledigt"?"g":r.due&&r.due<today()?"w":""}">${r.kind} · ${r.status}</span>`}};
/* Dateien (IndexedDB) */
const idb=()=>new Promise((ok,no)=>{try{const q=indexedDB.open("mvfiles",1);q.onupgradeneeded=()=>q.result.createObjectStore("f");q.onsuccess=()=>ok(q.result);q.onerror=()=>no()}catch(e){no()}});
async function fput(id,b){const d=await idb();return new Promise((ok,no)=>{const t=d.transaction("f","readwrite");t.objectStore("f").put(b,id);t.oncomplete=ok;t.onerror=no})}
async function fget(id){const d=await idb();return new Promise((ok,no)=>{const q=d.transaction("f").objectStore("f").get(id);q.onsuccess=()=>ok(q.result);q.onerror=no})}
async function fdel(id){try{const d=await idb();d.transaction("f","readwrite").objectStore("f").delete(id)}catch(e){}}
async function openFile(id){try{const b=await fget(id);if(!b)return alert("Datei nicht gefunden.");const u=URL.createObjectURL(b);const w=window.open(u,"_blank");if(!w)alert("Datei konnte nicht geöffnet werden. Nutze „Sicherung“ oder erlaube Pop-ups.")}catch(e){alert("Datei konnte nicht geladen werden.")}}
async function thumbs(){for(const i of document.querySelectorAll("img[data-fid]")){try{const b=await fget(i.dataset.fid);if(b)i.src=URL.createObjectURL(b)}catch(e){}}}
let yr=new Date().getFullYear(),sh="";const inS=id=>!sh||inH(id,sh);
/* Rendering */
function nav(){document.getElementById("nav").innerHTML=TABS.map(([k,l])=>`<button class="${k==tab?"on":""}" onclick="tab='${k}';render()">${l}</button>`).join("")}
function filt(){return S.units.length?`<select onchange="fu=this.value;render()"><option value="">Alle Wohnungen</option>${S.houses.map(x=>`<option value="h:${x.id}" ${fu=="h:"+x.id?"selected":""}>Haus ${h(x.name)} (alle)</option>`).join("")}${S.units.map(u=>`<option value="${u.id}" ${fu==u.id?"selected":""}>${h(un(u.id))}</option>`).join("")}</select>`:""}
function render(){nav();const m=document.getElementById("main");
 if(tab=="home")m.innerHTML=home();else if(tab=="pay")m.innerHTML=payView();else if(tab=="year")m.innerHTML=yearView();else if(tab=="abr")m.innerHTML=abrView();else m.innerHTML=list(tab);window.scrollTo(0,0);thumbs()}
function list(k){const c=SEC[k];let rows=S[k].slice();if(k=="meters"&&my)rows=rows.filter(r=>r.date.slice(0,4)==my);if(k=="oil"||k=="units"){if(fu.startsWith("h:"))rows=rows.filter(r=>r.house==fu.slice(2))}else if(k!="houses"&&fu)rows=rows.filter(r=>fu.startsWith("h:")?inH(r.unit,fu.slice(2)):r.unit==fu);if(c.sort)rows.sort(c.sort);if(k=="units")rows.sort((a,b)=>un(a.id).localeCompare(un(b.id)));
 const need=k!="units"&&k!="houses"&&k!="oil"&&!S.units.length;
 return `<div class="bar">${k!="houses"?filt():""}${k=="meters"?mybar():""}<button class="b p" onclick="${need?"alert('Bitte zuerst eine Wohnung anlegen.')":`edit('${k}')`}">+ ${c.t}</button></div>`+
 (rows.length?rows.map(r=>`<div class="card"><div class="row"><div><div class="t">${h(c.title(r))}</div>${c.tag?c.tag(r):""}<div class="s">${h(c.sub(r))}</div>${r.fid?(/\.(jpe?g|png|gif|webp)$/i.test(r.fname||"")?`<img class="th" data-fid="${r.fid}" alt="Foto" onclick="openFile('${r.fid}')">`:`<button class="b" style="margin-top:8px" onclick="openFile('${r.fid}')">Datei öffnen</button>`):""}</div>
 <div class="acts">${k=="tasks"&&r.status!="erledigt"?`<button class="b" onclick="done('${r.id}')">Erledigt</button>`:""}<button class="b" onclick="edit('${k}','${r.id}')">Ändern</button></div></div></div>`).join(""):`<div class="empty">${k=="units"?"Noch keine Wohnung. Lege mit „+ Wohnung“ deine erste an.":"Noch keine Einträge."}</div>`)}
function done(id){const r=S.tasks.find(x=>x.id==id);r.status="erledigt";save();render()}
function payView(){const us=S.units.filter(u=>u.rent>0);const key=u=>month+"|"+u.id;
 const paid=us.filter(u=>S.pay[key(u)]&&S.pay[key(u)].ok);const soll=us.reduce((a,u)=>a+Number(u.rent),0),ist=paid.reduce((a,u)=>a+Number(u.rent),0);
 return `<div class="bar"><input type="month" value="${month}" onchange="month=this.value||month;render()"></div>
 <div class="stats"><div class="stat"><b>${paid.length} / ${us.length}</b><span>Mieten eingegangen</span></div><div class="stat"><b>${eur(soll-ist)}</b><span>noch offen (Soll ${eur(soll)})</span></div></div>`+
 (us.length?us.map(u=>{const p=S.pay[key(u)]||{};return `<div class="card pay"><input type="checkbox" ${p.ok?"checked":""} onchange="setPay('${u.id}',this.checked)" aria-label="bezahlt"><div style="flex:1"><div class="t">${h(u.name)}</div><div class="s">${h(u.tenant||"")} · ${eur(u.rent)}${p.ok?" · eingegangen am "+fd(p.date):" · offen"}</div></div></div>`}).join(""):`<div class="empty">Trage bei einer Wohnung die Miete ein, dann erscheint sie hier zum Abhaken.</div>`)}
function setPay(id,ok){const k=month+"|"+id;S.pay[k]=ok?{ok:1,date:today()}:{ok:0};save();render()}
function home(){const od=S.tasks.filter(t=>t.status!="erledigt");const late=od.filter(t=>t.due&&t.due<today());
 const us=S.units.filter(u=>u.rent>0);const open=us.filter(u=>!(S.pay[month+"|"+u.id]||{}).ok);
 return `<div class="stats"><div class="stat"><b>${S.units.length}</b><span>Wohnungen</span></div><div class="stat"><b>${open.length}</b><span>Mieten offen (${month.slice(5)}/${month.slice(0,4)})</span></div><div class="stat"><b>${od.length}</b><span>offene Aufgaben</span></div><div class="stat"><b>${late.length}</b><span>überfällig</span></div></div>
 <h2>Nächste Aufgaben</h2>`+(od.length?od.sort(SEC.tasks.sort).slice(0,5).map(t=>`<div class="card"><div class="t">${h(t.title)}</div>${SEC.tasks.tag(t)}<div class="s">${h(SEC.tasks.sub(t))}</div></div>`).join(""):`<div class="empty">Keine offenen Aufgaben.</div>`)+
 `<h2>Datensicherung</h2><div class="card"><div class="s" style="margin-bottom:10px">Die Daten liegen nur auf diesem Gerät. Sichere sie regelmäßig als Datei (Fotos und Dokumente sind enthalten, die Datei kann dadurch groß werden).</div><div class="bar" style="margin:0"><button class="b" onclick="exp()">Sicherung speichern</button><button class="b" onclick="document.getElementById('imp').click()">Sicherung laden</button><input id="imp" type="file" accept=".json" hidden onchange="imp(this.files[0])"></div></div>`}
async function exp(){const j=JSON.stringify(S,null,1);try{const d=await claude.use("downloads");if(d){await d.save({filename:"mietverwaltung-"+today()+".json",data:new Blob([j],{type:"application/json"})});return}}catch(e){if(e&&e.code=="declined")return}
 alert("Speichern als Datei ist hier nicht verfügbar.")}
function imp(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!confirm("Aktuelle Daten durch die Sicherung ersetzen?"))return;S=Object.assign({units:[],meters:[],pay:{},moves:[],docs:[],tasks:[]},d);save();render()}catch(e){alert("Die Datei ist keine gültige Sicherung.")}};r.readAsText(f)}

async function sv(k,id){const f=document.getElementById("frm");if(!f.reportValidity())return;const c=SEC[k];let r=id?S[k].find(x=>x.id==id):{id:uid()};
 c.f.forEach(([n,,t])=>{const v=f.elements[n].value;r[n]=t=="number"&&v!==""?Number(v):v});
 const fi=f.elements.file&&f.elements.file.files[0];
 if(fi){try{if(r.fid)await fdel(r.fid);r.fid=r.fid||uid();await fput(r.fid,fi);r.fname=fi.name}catch(e){alert("Datei konnte nicht gespeichert werden.")}}
 if(!id)S[k].push(r);save();document.getElementById("dlg").close();render()}
function rm(k,id){const r=S[k].find(x=>x.id==id);if(!confirm("Wirklich löschen?"))return;if(r.fid)fdel(r.fid);S[k]=S[k].filter(x=>x.id!=id);
 if(k=="units"){["meters","moves","docs","tasks","nka"].forEach(s=>S[s]=S[s].filter(x=>x.unit!=id))}if(k=="houses"){S.units.forEach(u=>{if(u.house==id)u.house=""});S.meters=S.meters.filter(m=>m.unit!="h:"+id)}save();document.getElementById("dlg").close();render()}
render();
</script><script>if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}</script>
